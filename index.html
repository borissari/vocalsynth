<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vocalsynth v.5.4</title>
<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
}

#stage {
  position: absolute;
  top: 2cm;
  bottom: 2cm;
  left: 33vw;
  width: 34vw;
  border: 2px solid #444;
  overflow: hidden;
}

video {
  position: absolute;
  display: none;
  object-fit: cover;
  transform-origin: top left;
  transition: none;
}
</style>
</head>
<body>

<div id="stage">
  <video id="z" src="vocalsynth_ethan.mp4" playsinline></video>
  <video id="c" src="vocalsynth_bryan.mp4" playsinline></video>
  <video id="b" src="vocalsynth_dad.mp4" playsinline></video>
  <video id="m" src="vocalsynth_monsang.mp4" playsinline></video>
  <video id="dot" src="vocalsynth_mom.mp4" playsinline></video>
</div>

<script>
// Mapping
const vids = {
  z: document.getElementById('z'),
  c: document.getElementById('c'),
  b: document.getElementById('b'),
  m: document.getElementById('m'),
  ".": document.getElementById('dot')
};

// YOU phase positions
const startPos = {
  z: {x: 60, y: 10, w: 200, h: 120},
  c: {x: 10, y: 10, w: 200, h: 120},
  b: {x: 60, y: 60, w: 200, h: 120},
  m: {x: 10, y: 60, w: 200, h: 120},
  ".": {x: 35, y: 35, w: 200, h: 120}
};

// ME phase positions (fill screen, cropped into quadrants)
const facePos = {
  z: {x: 0, y:0, w:50, h:50, clip:'0 0 50% 50%'},   // top-left
  b: {x:50, y:0, w:50, h:50, clip:'50% 0 100% 50%'}, // top-right
  m: {x:0, y:50, w:50, h:50, clip:'0 50% 50% 100%'}, // bottom-left
  ".": {x:50, y:50, w:50, h:50, clip:'50% 50% 100% 100%'}, // bottom-right
  c: {x:25, y:25, w:50, h:50, clip:'25% 25% 75% 75%'} // center
};

let pressed = new Set();
let clock = 0;
let meCommitted = false;
let lastTime = performance.now();

// Set video display and volume
Object.values(vids).forEach(v=>{
  v.muted=false;
});

// Helper to set video style
function setVidStyle(v,pos){
  v.style.left = pos.x + '%';
  v.style.top = pos.y + '%';
  v.style.width = pos.w + '%';
  v.style.height = pos.h + '%';
  if(pos.clip) v.style.clip = `rect(${pos.clip})`;
  v.style.display='block';
}

// Input
document.addEventListener('keydown', e=>{
  const key = e.key.toLowerCase();
  if(!vids[key] || pressed.has(key)) return;
  pressed.add(key);

  if(!meCommitted) clock = 0;

  let v = vids[key];
  let p = startPos[key];
  setVidStyle(v,p);
  v.currentTime=0;
  v.play();
});

document.addEventListener('keyup', e=>{
  const key = e.key.toLowerCase();
  if(!vids[key]) return;
  pressed.delete(key);

  if(!meCommitted){
    vids[key].pause();
    vids[key].style.display='none';
  }
});

// Animation
function update(now){
  const dt = (now - lastTime)/1000;
  lastTime = now;

  const activeCount = pressed.size;

  if(activeCount>0 || meCommitted) clock += dt;

  // commit ME
  if(!meCommitted && activeCount===5){
    meCommitted=true;
  }

  // PAUSE phase (5-7s) move + scale + crop
  if(clock>=5 && clock<7){
    const alpha = (clock-5)/2; // 0->1
    Object.keys(vids).forEach(k=>{
      const v = vids[k];
      if(v.style.display==='none') return;
      const s = startPos[k];
      const f = facePos[k];
      setVidStyle(v,{
        x: s.x + (f.x - s.x)*alpha,
        y: s.y + (f.y - s.y)*alpha,
        w: s.w + (f.w - s.w)*alpha,
        h: s.h + (f.h - s.h)*alpha,
        clip: f.clip
      });
    });
  }

  // ME phase
  if(clock>=7){
    Object.keys(vids).forEach(k=>{
      setVidStyle(vids[k],facePos[k]);
    });
  }

  // Reset after 12s
  if(meCommitted && clock>=12){
    clock=0;
    meCommitted=false;
    pressed.clear();
    Object.values(vids).forEach(v=>{
      v.pause();
      v.style.display='none';
    });
  }

  requestAnimationFrame(update);
}

requestAnimationFrame(update);
</script>

</body>
</html>
