<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>VocalSynth V.4.1</title>

<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
  }

  /* central screen area */
  #screen {
    position: absolute;
    left: 33vw;
    width: 34vw;
    top: 2cm;
    bottom: 2cm;
    border: 2px solid #333;
  }

  .vid, .square {
    position: absolute;
    width: 30%;
    height: 30%;
    display: none;
    object-fit: cover;
    transition: all 1s ease;
  }

  /* normal spread positions */
  #z { top: 0; left: 0; }
  #c { top: 0; right: 0; }
  #b { bottom: 0; left: 0; }
  #m { bottom: 0; right: 0; }
  #dot { top: 35%; left: 35%; }

  /* FACE POSITIONS */
  .face-z { top: 10%; left: 20%; width: 25%; height: 20%; object-position: center 20%; }
  .face-c { top: 10%; right: 20%; width: 25%; height: 20%; }
  .face-b { top: 35%; left: 37%; width: 25%; height: 25%; object-position: center 50%; }
  .face-m { bottom: 15%; left: 35%; width: 30%; height: 20%; object-position: center 80%; }
  .face-dot { top: 30%; right: 5%; width: 20%; height: 40%; object-position: 80% center; }

  .square {
    background: #444;
    color: white;
    font-size: 24px;
    display: none;
    align-items: center;
    justify-content: center;
  }
</style>
</head>

<body>

<div id="screen">

  <video id="z" class="vid" src="vocalsynth_ethan.mp4" muted playsinline></video>
  <div id="c" class="square">C</div>
  <video id="b" class="vid" src="vocalsynth_dad.mp4" muted playsinline></video>
  <video id="m" class="vid" src="vocalsynth_monsang.mp4" muted playsinline></video>
  <video id="dot" class="vid" src="vocalsynth_mom.mp4" muted playsinline></video>

</div>

<script>
const keys = {
  z: document.getElementById("z"),
  c: document.getElementById("c"),
  b: document.getElementById("b"),
  m: document.getElementById("m"),
  ".": document.getElementById("dot")
};

let pressed = new Set();
let faceMode = false;

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (!keys[k]) return;
  if (pressed.has(k)) return;

  pressed.add(k);
  const el = keys[k];

  el.style.display = "flex";

  if (el.tagName === "VIDEO") {
    el.currentTime = 0;
    el.muted = false;
    el.play();
  }

  checkAllPressed();
});

document.addEventListener("keyup", e => {
  const k = e.key.toLowerCase();
  if (!keys[k]) return;

  pressed.delete(k);

  if (!faceMode) {
    const el = keys[k];
    if (el.tagName === "VIDEO") {
      el.pause();
      el.currentTime = 0;
    }
    el.style.display = "none";
  }
});

function checkAllPressed() {
  if (pressed.size === 5 && !faceMode) {
    faceMode = true;

    setTimeout(() => {
      keys.z.classList.add("face-z");
      keys.c.classList.add("face-c");
      keys.b.classList.add("face-b");
      keys.m.classList.add("face-m");
      keys["."].classList.add("face-dot");

      Object.values(keys).forEach(el => {
        if (el.tagName === "VIDEO") el.play();
      });
    }, 300);
  }
}
</script>

</body>
</html>
