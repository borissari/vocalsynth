<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vocalsynth V.5.1</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
}

/* middle screen */
#stage {
  position: absolute;
  top: 2cm;
  bottom: 2cm;
  left: 33vw;
  width: 34vw;
  border: 2px solid #444;
}

/* videos */
.video {
  position: absolute;
  width: 160px;
  height: 160px;
  object-fit: cover;
  display: none;
  transition: left 2s linear, top 2s linear, clip-path 2s linear;
}

/* scattered YOU positions */
#v_z { left: 10%; top: 10%; }
#v_c { left: 60%; top: 10%; }
#v_b { left: 35%; top: 35%; }
#v_m { left: 10%; top: 60%; }
#v_dot { left: 60%; top: 60%; }

/* face ME positions */
.face-z { left: 38%; top: 30%; clip-path: inset(20% 20% 20% 20%); }   /* eye */
.face-c { left: 48%; top: 30%; clip-path: inset(20% 20% 20% 20%); }   /* eye */
.face-b { left: 43%; top: 45%; clip-path: inset(30% 30% 30% 30%); }   /* nose */
.face-m { left: 38%; top: 60%; clip-path: inset(40% 10% 10% 10%); }   /* mouth */
.face-dot { left: 48%; top: 60%; clip-path: inset(40% 10% 10% 10%); } /* mouth */
</style>
</head>

<body>

<div id="stage">
  <video id="v_z" class="video" src="vocalsynth_ethan.mp4"></video>
  <video id="v_c" class="video" src="vocalsynth_bryan.mp4"></video>
  <video id="v_b" class="video" src="vocalsynth_dad.mp4"></video>
  <video id="v_m" class="video" src="vocalsynth_monsang.mp4"></video>
  <video id="v_dot" class="video" src="vocalsynth_mom.mp4"></video>
</div>

<script>
const videos = {
  z: document.getElementById("v_z"),
  c: document.getElementById("v_c"),
  b: document.getElementById("v_b"),
  m: document.getElementById("v_m"),
  ".": document.getElementById("v_dot")
};

const pressed = new Set();
let clock = 0;
let meCommitted = false;
let lastTime = performance.now();

/* ---------------- INPUT ---------------- */

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (!videos[k] || pressed.has(k)) return;

  pressed.add(k);
  const v = videos[k];

  v.style.display = "block";
  v.currentTime = 0;
  v.muted = false;
  v.play();

  if (pressed.size === 1 && !meCommitted) clock = 0;
});

document.addEventListener("keyup", e => {
  const k = e.key.toLowerCase();
  if (!videos[k]) return;

  pressed.delete(k);

  if (!meCommitted) {
    videos[k].pause();
    videos[k].style.display = "none";
  }
});

/* ---------------- TIMING ---------------- */

function update(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  if (pressed.size > 0 || meCommitted) clock += dt;

  // commit ME
  if (!meCommitted && pressed.size === 5) {
    meCommitted = true;
  }

  // move + crop during PAUSE
  if (clock >= 5 && clock < 7 && meCommitted) {
    videos.z.classList.add("face-z");
    videos.c.classList.add("face-c");
    videos.b.classList.add("face-b");
    videos.m.classList.add("face-m");
    videos["."].classList.add("face-dot");
  }

  // reset after ME
  if (meCommitted && clock >= 12) {
    clock = 0;
    meCommitted = false;
    pressed.clear();

    Object.values(videos).forEach(v => {
      v.pause();
      v.style.display = "none";
      v.className = "video";
    });
  }

  requestAnimationFrame(update);
}

requestAnimationFrame(update);
</script>

</body>
</html>
