<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vocalsynth – Overlap Composite Face</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    height: 100%;
  }

  /* Stage = middle 1/3 of screen, full height */
  #stage {
    position: absolute;
    left: 33.333vw;
    width: 33.333vw;
    height: 100vh;
    background: black;
    overflow: hidden;
  }

  video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;   /* preserve ratio */
    opacity: 0;
    pointer-events: none;
  }

  video.active {
    opacity: 0.35;         /* low opacity = composite face */
  }

  #debug {
    position: fixed;
    top: 10px;
    left: 10px;
    color: white;
    font-family: monospace;
    font-size: 14px;
  }
</style>
</head>

<body>

<div id="stage"></div>
<div id="debug">Keys held: 0 / 5</div>

<script>
/* ---------------- CONFIG ---------------- */

const VIDEOS = {
  z: "vocalsynth_ethan.mp4",
  c: "vocalsynth_bryan.mp4",
  b: "vocalsynth_dad.mp4",
  m: "vocalsynth_monsang.mp4",
  ".": "vocalsynth_mom.mp4"
};

/* ---------------- SETUP ---------------- */

const stage = document.getElementById("stage");
const debug = document.getElementById("debug");

const videoEls = {};
const keysDown = new Set();

for (const key in VIDEOS) {
  const v = document.createElement("video");
  v.src = VIDEOS[key];
  v.preload = "auto";
  v.muted = false;
  v.loop = false;
  v.playsInline = true;
  stage.appendChild(v);
  videoEls[key] = v;
}

/* ---------------- INPUT ---------------- */

document.addEventListener("keydown", e => {
  const key = e.key.toLowerCase();
  if (!(key in videoEls)) return;
  if (keysDown.has(key)) return;

  keysDown.add(key);
  const v = videoEls[key];

  v.currentTime = 0;
  v.classList.add("active");
  v.style.opacity = "0.35";

  v.play().catch(err => {
    console.warn("Play blocked:", err);
  });

  updateDebug();
});

document.addEventListener("keyup", e => {
  const key = e.key.toLowerCase();
  if (!(key in videoEls)) return;

  keysDown.delete(key);

  /* If not all 5 committed, hide on release */
  if (keysDown.size < 5) {
    const v = videoEls[key];
    v.pause();
    v.currentTime = 0;
    v.classList.remove("active");
    v.style.opacity = "0";
  }

  updateDebug();
});

/* ---------------- DEBUG ---------------- */

function updateDebug() {
  debug.textContent = `Keys held: ${keysDown.size} / 5`;
}
</script>

</body>
</html>
