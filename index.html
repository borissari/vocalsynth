<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocalsynth v2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        /* Stage container - middle 1/3 of screen, centered */
        #stage {
            position: relative;
            width: 33.333vw;
            height: 100vh;
            background: #111;
            overflow: hidden;
        }
        
        /* Video elements */
        video {
            position: absolute;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        video.active {
            opacity: 1;
        }
        
        /* Debug info */
        #info {
            position: fixed;
            top: 10px;
            right: 10px;
            color: #fff;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            line-height: 1.6;
        }
        
        .pressed {
            color: #0f0;
        }
    </style>
</head>
<body>
    <div id="stage"></div>
    <div id="info">
        <div>Phase: <span id="phase">YOU</span></div>
        <div>All 5 keys held: <span id="all-held">NO</span></div>
        <div style="margin-top: 10px;">
            Z: <span id="key-z">-</span><br>
            C: <span id="key-c">-</span><br>
            B: <span id="key-b">-</span><br>
            M: <span id="key-m">-</span><br>
            .: <span id="key-period">-</span>
        </div>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        const VIDEO_MAPPING = {
            'z': 'vocalsynth_ethan.mp4',
            'c': 'vocalsynth_bryan.mp4',
            'b': 'vocalsynth_dad.mp4',
            'm': 'vocalsynth_monsang.mp4',
            '.': 'vocalsynth_mom.mp4'
        };
        
        const PHASE_TIMING = {
            PAUSE: 2,    // 2 seconds for PAUSE phase (transition animation)
            ME: 5        // 5 seconds for ME phase
        };
        
        // Final positions for ME phase (as percentages of stage)
        // Each quadrant is 50% x 50%, videos fill entire quadrants
        const FINAL_POSITIONS = {
            'z': { x: 0, y: 0, width: 50, height: 50, clip: 'none' },        // top-left
            'b': { x: 50, y: 0, width: 50, height: 50, clip: 'none' },       // top-right
            'm': { x: 0, y: 50, width: 50, height: 50, clip: 'none' },       // bottom-left
            '.': { x: 50, y: 50, width: 50, height: 50, clip: 'none' },      // bottom-right
            'c': { x: 25, y: 25, width: 50, height: 50, clip: 'none' }       // center overlapping
        };
        
        // ==================== STATE ====================
        const state = {
            phase: 'YOU',              // Current phase: YOU, PAUSE, ME
            keysDown: new Set(),       // Currently held down keys
            videoElements: {},         // Video DOM elements
            videoTimes: {},            // Track each video's individual time
            scatteredPos: {},          // Scattered positions for each video
            pauseStartTime: null,      // When PAUSE phase started
            pauseVideoTimes: {},       // Video times when PAUSE started (for synchronization)
            meStartTime: null,         // When ME phase started
            animationFrame: null       // RAF handle
        };
        
        // ==================== INITIALIZATION ====================
        const stage = document.getElementById('stage');
        
        // Create video elements
        for (const [key, filename] of Object.entries(VIDEO_MAPPING)) {
            const video = document.createElement('video');
            video.src = filename;
            video.muted = true;
            video.style.display = 'none';
            stage.appendChild(video);
            state.videoElements[key] = video;
            state.videoTimes[key] = 0;
            
            // Generate scattered position for each video
            state.scatteredPos[key] = getRandomPosition();
        }
        
        // ==================== UTILITY FUNCTIONS ====================
        
        // Generate random scattered position within stage
        function getRandomPosition() {
            return {
                x: Math.random() * 60 + 5,  // 5-65% from left
                y: Math.random() * 60 + 5,  // 5-65% from top
                width: 30 + Math.random() * 20, // 30-50% width
                height: 30 + Math.random() * 20 // 30-50% height
            };
        }
        
        // Apply position to video element
        function applyPosition(key, pos, clipPath = 'none') {
            const video = state.videoElements[key];
            video.style.left = `${pos.x}%`;
            video.style.top = `${pos.y}%`;
            video.style.width = `${pos.width}%`;
            video.style.height = `${pos.height}%`;
            video.style.clipPath = clipPath;
        }
        
        // Linear interpolation
        function lerp(start, end, t) {
            return start + (end - start) * t;
        }
        
        // Ease in-out cubic for smoother animation
        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }
        
        // Check if all 5 keys are currently held down
        function allKeysHeld() {
            return state.keysDown.size === 5 && 
                   ['z', 'c', 'b', 'm', '.'].every(k => state.keysDown.has(k));
        }
        
        // ==================== MAIN UPDATE LOOP ====================
        
        function update() {
            // YOU PHASE: Update each video's individual time
            if (state.phase === 'YOU') {
                for (const key of state.keysDown) {
                    const video = state.videoElements[key];
                    state.videoTimes[key] = video.currentTime;
                }
            }
            
            // PAUSE PHASE: Animate transition
            if (state.phase === 'PAUSE') {
                const elapsed = (Date.now() - state.pauseStartTime) / 1000;
                const t = Math.min(elapsed / PHASE_TIMING.PAUSE, 1);
                const easedT = easeInOutCubic(t);
                
                // Interpolate positions
                for (const key of Object.keys(VIDEO_MAPPING)) {
                    const start = state.scatteredPos[key];
                    const end = FINAL_POSITIONS[key];
                    
                    const currentPos = {
                        x: lerp(start.x, end.x, easedT),
                        y: lerp(start.y, end.y, easedT),
                        width: lerp(start.width, end.width, easedT),
                        height: lerp(start.height, end.height, easedT)
                    };
                    
                    applyPosition(key, currentPos);
                }
                
                // Transition to ME phase when PAUSE completes
                if (t >= 1) {
                    enterMEPhase();
                }
            }
            
            // ME PHASE: Just wait for completion
            if (state.phase === 'ME') {
                const elapsed = (Date.now() - state.meStartTime) / 1000;
                
                // Reset after ME phase completes
                if (elapsed >= PHASE_TIMING.ME) {
                    reset();
                    return;
                }
            }
            
            updateDebugInfo();
            state.animationFrame = requestAnimationFrame(update);
        }
        
        // ==================== PHASE TRANSITIONS ====================
        
        function enterPausePhase() {
            state.phase = 'PAUSE';
            state.pauseStartTime = Date.now();
            
            // Capture current video times for synchronization
            for (const key of Object.keys(VIDEO_MAPPING)) {
                const video = state.videoElements[key];
                state.pauseVideoTimes[key] = video.currentTime;
            }
            
            // Show all videos, unmute, and ensure they're playing
            for (const key of Object.keys(VIDEO_MAPPING)) {
                const video = state.videoElements[key];
                video.style.display = 'block';
                video.classList.add('active');
                video.muted = false;
                video.play();
            }
            
            // Start update loop if not already running
            if (!state.animationFrame) {
                update();
            }
        }
        
        function enterMEPhase() {
            state.phase = 'ME';
            state.meStartTime = Date.now();
            
            // Apply final positions with clip-path
            for (const key of Object.keys(VIDEO_MAPPING)) {
                const pos = FINAL_POSITIONS[key];
                applyPosition(key, pos, pos.clip);
            }
        }
        
        // ==================== RESET ====================
        
        function resetAllVideosInYouPhase() {
            // Stop and hide all videos that are currently playing
            for (const key of Object.keys(VIDEO_MAPPING)) {
                const video = state.videoElements[key];
                video.pause();
                video.currentTime = 0;
                video.muted = true;
                video.classList.remove('active');
                video.style.display = 'none';
            }
            
            // Clear all keys down
            state.keysDown.clear();
            
            updateDebugInfo();
        }
        
        function reset() {
            // Stop animation loop
            if (state.animationFrame) {
                cancelAnimationFrame(state.animationFrame);
                state.animationFrame = null;
            }
            
            // Stop and hide all videos
            for (const video of Object.values(state.videoElements)) {
                video.pause();
                video.currentTime = 0;
                video.muted = true;
                video.classList.remove('active');
                video.style.display = 'none';
                video.style.clipPath = 'none';
            }
            
            // Reset state
            state.phase = 'YOU';
            state.keysDown.clear();
            state.videoTimes = {};
            state.pauseVideoTimes = {};
            state.pauseStartTime = null;
            state.meStartTime = null;
            
            // Reset video times tracking
            for (const key of Object.keys(VIDEO_MAPPING)) {
                state.videoTimes[key] = 0;
            }
            
            updateDebugInfo();
        }
        
        // ==================== KEY HANDLERS ====================
        
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            
            // Ignore if not a mapped key or already down
            if (!VIDEO_MAPPING[key] || state.keysDown.has(key)) return;
            
            state.keysDown.add(key);
            const video = state.videoElements[key];
            
            // Only respond in YOU phase
            if (state.phase === 'YOU') {
                // Position video at scattered position
                applyPosition(key, state.scatteredPos[key]);
                
                // Show and play video
                video.style.display = 'block';
                video.classList.add('active');
                video.currentTime = 0;
                video.muted = false;
                video.play();
                
                // Check if all 5 keys are now held simultaneously
                if (allKeysHeld()) {
                    enterPausePhase();
                }
            }
            
            updateDebugInfo();
        });
        
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            
            if (!VIDEO_MAPPING[key]) return;
            
            state.keysDown.delete(key);
            const video = state.videoElements[key];
            
            // YOU PHASE: Stop and hide video when key released
            if (state.phase === 'YOU') {
                video.pause();
                video.currentTime = 0;
                video.muted = true;
                video.classList.remove('active');
                video.style.display = 'none';
                
                // If any key is released before all 5 are held, reset all videos
                if (state.keysDown.size < 5) {
                    resetAllVideosInYouPhase();
                }
            }
            // PAUSE/ME PHASE: Videos continue playing (don't respond to key release)
            
            updateDebugInfo();
        });
        
        // ==================== DEBUG INFO ====================
        
        function updateDebugInfo() {
            document.getElementById('phase').textContent = state.phase;
            document.getElementById('all-held').textContent = allKeysHeld() ? 'YES' : 'NO';
            
            // Update individual key status
            for (const key of Object.keys(VIDEO_MAPPING)) {
                const elemId = `key-${key === '.' ? 'period' : key}`;
                const elem = document.getElementById(elemId);
                elem.textContent = state.keysDown.has(key) ? 'HELD' : '-';
                elem.className = state.keysDown.has(key) ? 'pressed' : '';
            }
        }
    </script>
</body>
</html>
