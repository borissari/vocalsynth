<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vocalsynthV.3.3</title>

<style>
  body {
    background: black;
    margin: 0;
    overflow: hidden;
  }

  #stage {
    position: absolute;
    top: 2cm;
    bottom: 2cm;
    left: 33vw;
    width: 34vw;
    overflow: hidden;
  }

  video {
    position: absolute;
    width: 40%;
    height: 40%;
    object-fit: cover;
    display: none;
    transition: none;
  }
</style>
</head>

<body>

<div id="stage">
  <video id="z" src="vocalsynth_ethan.mp4" playsinline></video>
  <video id="b" src="vocalsynth_dad.mp4" playsinline></video>
  <video id="m" src="vocalsynth_monsang.mp4" playsinline></video>
  <video id="dot" src="vocalsynth_mom.mp4" playsinline></video>

  <!-- placeholder for C -->
  <div id="c" style="display:none"></div>
</div>

<script>
/* ---------------- SETUP ---------------- */

const videos = {
  z: document.getElementById("z"),
  b: document.getElementById("b"),
  m: document.getElementById("m"),
  ".": document.getElementById("dot")
};

// YOU positions
const startPos = {
  z: { x: 55, y: 5 },
  b: { x: 55, y: 55 },
  m: { x: 5,  y: 55 },
  ".": { x: 5,  y: 5 }
};

// ME face positions
const facePos = {
  z: { x: 30, y: 25 }, // eye
  b: { x: 45, y: 40 }, // nose
  m: { x: 30, y: 55 }, // mouth
  ".": { x: 45, y: 55 }
};

function setPosition(v, pos) {
  v.style.left = pos.x + "%";
  v.style.top  = pos.y + "%";
}

/* ---------------- TIMING ---------------- */

const pressed = new Set();
let clock = 0;
let meCommitted = false;
let lastTime = performance.now();

/* ---------------- INPUT ---------------- */

document.addEventListener("click", () => {
  Object.values(videos).forEach(v => v.muted = false);
});

document.addEventListener("keydown", e => {
  const key = e.key.toLowerCase();
  const v = videos[key];
  if (!v || pressed.has(key)) return;

  pressed.add(key);
  v.style.display = "block";
  v.currentTime = 0;
  setPosition(v, startPos[key]);
  v.play();

  if (pressed.size === 1 && !meCommitted) clock = 0;
});

document.addEventListener("keyup", e => {
  const key = e.key.toLowerCase();
  const v = videos[key];
  if (!v) return;

  pressed.delete(key);

  if (!meCommitted) {
    v.pause();
    v.style.display = "none";
  }
});

/* ---------------- LOOP ---------------- */

function update(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  const activeCount = pressed.size;

  if (activeCount > 0 || meCommitted) {
    clock += dt;
  }

  // YOU loop (1–5)
  if (!meCommitted && activeCount < 4) {
    Object.values(videos).forEach(v => {
      if (v.style.display !== "none" && v.currentTime >= 5) {
        v.currentTime = 1;
      }
    });
  }

  // commit ME
  if (!meCommitted && activeCount === 4) {
    meCommitted = true;
  }

  // PAUSE motion
  if (clock >= 5 && clock < 7) {
    const alpha = (clock - 5) / 2;
    Object.entries(videos).forEach(([k, v]) => {
      if (v.style.display === "none") return;
      const a = startPos[k];
      const b = facePos[k];
      setPosition(v, {
        x: a.x + (b.x - a.x) * alpha,
        y: a.y + (b.y - a.y) * alpha
      });
    });
  }

  // lock ME
  if (clock >= 7) {
    Object.entries(videos).forEach(([k, v]) => {
      if (v.style.display === "none") return;
      setPosition(v, facePos[k]);
    });
  }

  // END → RESET
  if (meCommitted && clock >= 12) {
    clock = 0;
    meCommitted = false;
    pressed.clear();
    Object.values(videos).forEach(v => {
      v.pause();
      v.style.display = "none";
    });
  }

  requestAnimationFrame(update);
}

requestAnimationFrame(update);
</script>

</body>
</html>
