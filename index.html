<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vocalsynth V.5.3</title>

<style>
  body {
    background: black;
    margin: 0;
    overflow: hidden;
    font-family: monospace;
  }

  #stage {
    position: absolute;
    top: 2cm;
    bottom: 2cm;
    left: 33vw;
    width: 34vw;
    border: 2px solid #444;
    overflow: hidden;
  }

  video {
    position: absolute;
    display: none;
    object-fit: contain;
    transition: none;
    pointer-events: none;
  }

  #sound {
    position: fixed;
    right: 20px;
    top: 20px;
    color: red;
    font-size: 16px;
  }
</style>
</head>

<body>

<div id="stage">
  <video id="z" src="vocalsynth_ethan.mp4"></video>
  <video id="c" src="vocalsynth_bryan.mp4"></video>
  <video id="b" src="vocalsynth_dad.mp4"></video>
  <video id="m" src="vocalsynth_monsang.mp4"></video>
  <video id="dot" src="vocalsynth_mom.mp4"></video>
</div>

<div id="sound">🔇 SOUND OFF</div>

<script>
/* ---------------- SETUP ---------------- */

const stage = document.getElementById("stage");

const videos = {
  z: document.getElementById("z"),
  c: document.getElementById("c"),
  b: document.getElementById("b"),
  m: document.getElementById("m"),
  ".": document.getElementById("dot")
};

// YOU positions (scattered)
const startPos = {
  z: { x: 65, y: 15 },
  c: { x: 15, y: 15 },
  b: { x: 65, y: 65 },
  m: { x: 15, y: 65 },
  ".": { x: 40, y: 40 }
};

// ME position (all overlap here)
const centerPos = { x: 50, y: 50 };

function setPosition(el, pos) {
  el.style.left = pos.x + "%";
  el.style.top = pos.y + "%";
  el.style.transform = "translate(-50%, -50%)";
}

/* ---------------- TIMING ---------------- */

const pressed = new Set();
let clock = 0;
let meCommitted = false;
let lastTime = performance.now();

/* ---------------- INPUT ---------------- */

document.addEventListener("keydown", e => {
  const key = e.key.toLowerCase();
  const v = videos[key];
  if (!v || pressed.has(key)) return;

  pressed.add(key);

  v.style.display = "block";
  setPosition(v, startPos[key]);
  v.style.height = "30%";
  v.style.width = "auto";

  v.currentTime = 0;
  v.muted = false;
  v.play();

  if (pressed.size === 1 && !meCommitted) {
    clock = 0;
  }
});

document.addEventListener("keyup", e => {
  const key = e.key.toLowerCase();
  const v = videos[key];
  if (!v) return;

  pressed.delete(key);

  if (!meCommitted) {
    v.pause();
    v.style.display = "none";
  }
});

/* ---------------- ANIMATION LOOP ---------------- */

function update(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  const activeCount = pressed.size;

  if (activeCount > 0 || meCommitted) {
    clock += dt;
  }

  // commit ME
  if (!meCommitted && activeCount === 5) {
    meCommitted = true;
  }

  // reset
  if (meCommitted && clock >= 12) {
    clock = 0;
    meCommitted = false;
    pressed.clear();
    Object.values(videos).forEach(v => {
      v.pause();
      v.style.display = "none";
    });
  }

  // PAUSE → move toward center
  if (clock >= 5 && clock < 7) {
    const alpha = (clock - 5) / 2;

    Object.entries(videos).forEach(([k, v]) => {
      if (v.style.display === "none") return;
      const a = startPos[k];
      setPosition(v, {
        x: a.x + (50 - a.x) * alpha,
        y: a.y + (50 - a.y) * alpha
      });
    });
  }

  // ME → overlap & fill height
  if (clock >= 7) {
    Object.values(videos).forEach(v => {
      if (v.style.display === "none") return;
      setPosition(v, centerPos);
      v.style.height = "100%";
      v.style.width = "auto";
    });
  }

  document.getElementById("sound").textContent =
    (activeCount > 0 || meCommitted) ? "🔊 SOUND ON" : "🔇 SOUND OFF";

  requestAnimationFrame(update);
}

requestAnimationFrame(update);
</script>

</body>
</html>
