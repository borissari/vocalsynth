<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>V.7.1 Vocalsynth</title>
<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
  }
  video {
    position: absolute;
    object-fit: cover;
    transition: all 1s ease-in-out;
    opacity: 1;
    display: none;
  }
</style>
</head>
<body>

<script>
const VIDEO_MAPPING = {
  z: 'vs_ethan.mp4',
  c: 'vs_bryan.mp4',
  b: 'vs_dad.mp4',
  m: 'vs_monsang.mp4',
  '.': 'vs_mom.mp4'
};

// Start positions inside middle 1/3 horizontally
const START_POS = {
  z: { left: '35%', top: '10%', width: '10%', height: '30%' },
  c: { left: '55%', top: '10%', width: '10%', height: '30%' },
  b: { left: '35%', top: '55%', width: '10%', height: '30%' },
  m: { left: '55%', top: '55%', width: '10%', height: '30%' },
  '.': { left: '45%', top: '35%', width: '10%', height: '30%' }
};

// ME phase positions, full height, overlapping
const ME_POS = {
  z: { left: '0%', top: '0%', width: '100%', height: '100%', opacity: 0.6 },
  c: { left: '0%', top: '0%', width: '100%', height: '100%', opacity: 0.6 },
  b: { left: '0%', top: '0%', width: '100%', height: '100%', opacity: 0.6 },
  m: { left: '0%', top: '0%', width: '100%', height: '100%', opacity: 0.6 },
  '.': { left: '0%', top: '0%', width: '100%', height: '100%', opacity: 0.6 }
};

const videos = {};
const keysDown = new Set();
let meCommitted = false;
let meDelayTimeout = null;

// Create video elements
for (const [key, src] of Object.entries(VIDEO_MAPPING)) {
  const vid = document.createElement('video');
  vid.src = src;
  vid.muted = false;
  vid.preload = 'auto';
  document.body.appendChild(vid);
  videos[key] = vid;
}

// Helper to apply position & size
function setVideoPos(video, pos) {
  video.style.left = pos.left;
  video.style.top = pos.top;
  video.style.width = pos.width;
  video.style.height = pos.height;
  if (pos.opacity !== undefined) video.style.opacity = pos.opacity;
}

// Key handling
document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (!VIDEO_MAPPING[key] || keysDown.has(key)) return;
  keysDown.add(key);

  const vid = videos[key];
  setVideoPos(vid, START_POS[key]);
  vid.style.display = 'block';
  vid.currentTime = 0;
  vid.play();

  // Commit ME phase if all 5 keys pressed
  if (keysDown.size === 5 && !meCommitted) {
    meCommitted = true;
    // Wait 5 seconds before moving to ME
    meDelayTimeout = setTimeout(() => {
      for (const k of Object.keys(videos)) {
        setVideoPos(videos[k], ME_POS[k]);
      }
    }, 5000);
  }
});

document.addEventListener('keyup', e => {
  const key = e.key.toLowerCase();
  if (!VIDEO_MAPPING[key]) return;
  keysDown.delete(key);

  // If ME not committed yet, stop video when key released
  if (!meCommitted) {
    const vid = videos[key];
    vid.pause();
    vid.style.display = 'none';
  }
});

// Reset videos after all ended
function checkVideosEnd() {
  if (!meCommitted) return;
  let allEnded = true;
  for (const vid of Object.values(videos)) {
    if (!vid.ended) allEnded = false;
  }
  if (allEnded) {
    for (const vid of Object.values(videos)) {
      vid.pause();
      vid.style.display = 'none';
    }
    keysDown.clear();
    meCommitted = false;
    clearTimeout(meDelayTimeout);
    meDelayTimeout = null;
  }
  requestAnimationFrame(checkVideosEnd);
}
requestAnimationFrame(checkVideosEnd);

</script>
</body>
</html>
