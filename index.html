<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vocalsynth V.5.2</title>

<style>
  body {
    background: black;
    margin: 0;
    overflow: hidden;
  }

  #stage {
    position: absolute;
    top: 2cm;
    bottom: 2cm;
    left: 33vw;
    width: 34vw;
    border: 2px solid #444;
  }

  video {
    position: absolute;
    width: 180px;   /* bigger than squares */
    height: 180px;
    object-fit: cover;
    display: none;
    transition: none;
  }
</style>
</head>

<body>

<div id="stage">
  <video id="z" src="vocalsynth_ethan.mp4"></video>
  <video id="c" src="vocalsynth_bryan.mp4"></video>
  <video id="b" src="vocalsynth_dad.mp4"></video>
  <video id="m" src="vocalsynth_monsang.mp4"></video>
  <video id="dot" src="vocalsynth_mom.mp4"></video>
</div>

<script>
/* ---------------- SETUP ---------------- */

const videos = {
  z: document.getElementById("z"),
  c: document.getElementById("c"),
  b: document.getElementById("b"),
  m: document.getElementById("m"),
  ".": document.getElementById("dot")
};

const startPos = {
  z: { x: 65, y: 10 },
  c: { x: 10, y: 10 },
  b: { x: 65, y: 65 },
  m: { x: 10, y: 65 },
  ".": { x: 37, y: 37 }
};

const mergePos = {
  z: { x: 30, y: 25 },
  c: { x: 45, y: 25 },
  b: { x: 37, y: 40 },
  m: { x: 30, y: 55 },
  ".": { x: 45, y: 55 }
};

function setPos(el, pos) {
  el.style.left = pos.x + "%";
  el.style.top = pos.y + "%";
}

/* ---------------- TIMING ---------------- */

const pressed = new Set();
let clock = 0;
let meCommitted = false;
let lastTime = performance.now();

/* ---------------- INPUT ---------------- */

document.addEventListener("keydown", e => {
  const key = e.key.toLowerCase();
  const v = videos[key];
  if (!v || pressed.has(key)) return;

  pressed.add(key);

  v.style.display = "block";
  setPos(v, startPos[key]);

  v.currentTime = 0;
  v.muted = false;
  v.play();

  if (pressed.size === 1 && !meCommitted) {
    clock = 0;
  }
});

document.addEventListener("keyup", e => {
  const key = e.key.toLowerCase();
  const v = videos[key];
  if (!v) return;

  pressed.delete(key);

  if (!meCommitted) {
    v.pause();
    v.style.display = "none";
  }
});

/* ---------------- ANIMATION LOOP ---------------- */

function update(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  const activeCount = pressed.size;

  if (activeCount > 0 || meCommitted) {
    clock += dt;
  }

  // commit ME
  if (!meCommitted && activeCount === 5) {
    meCommitted = true;
  }

  // reset after ME ends
  if (meCommitted && clock >= 12) {
    clock = 0;
    meCommitted = false;
    pressed.clear();
    Object.values(videos).forEach(v => {
      v.pause();
      v.style.display = "none";
    });
  }

  // motion during PAUSE (5–7)
  if (clock >= 5 && clock < 7) {
    const a = (clock - 5) / 2;
    Object.entries(videos).forEach(([k, v]) => {
      if (v.style.display === "none") return;
      const s = startPos[k];
      const m = mergePos[k];
      setPos(v, {
        x: s.x + (m.x - s.x) * a,
        y: s.y + (m.y - s.y) * a
      });
    });
  }

  // lock merged
  if (clock >= 7) {
    Object.entries(videos).forEach(([k, v]) => {
      if (v.style.display === "none") return;
      setPos(v, mergePos[k]);
    });
  }

  requestAnimationFrame(update);
}

requestAnimationFrame(update);
</script>

</body>
</html>
