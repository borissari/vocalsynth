<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>V.7.4.2 Vocalsynth</title>
<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
  }
  video {
    position: absolute;
    object-fit: cover;
    transition: all 1s ease-in-out;
    opacity: 1;
    display: none;
  }
</style>
</head>
<body>

<script>
const VIDEO_MAPPING = {
  z: 'vs_ethan.mp4',
  c: 'vs_bryan.mp4',
  b: 'vs_dad.mp4',
  m: 'vs_monsang.mp4',
  '.': 'vs_mom.mp4'
};

// Start positions inside middle 1/3 horizontally
const START_POS = {

  z: { left: '32%', top: '8%', width: '14%', height: '38%' },
  c: { left: '52%', top: '8%', width: '14%', height: '38%' },
  b: { left: '32%', top: '52%', width: '14%', height: '38%' },
  m: { left: '52%', top: '52%', width: '14%', height: '38%' },
  '.': { left: '42%', top: '32%', width: '14%', height: '38%' }
};

  

// ME phase positions, full height, overlapping, slightly transparent, shifted left by 2%
const ME_POS = {
  z: { left: '-2%', top: '0%', width: '100%', height: '100%', opacity: 1.0 },
  c: { left: '-2%', top: '0%', width: '100%', height: '100%', opacity: 0.6 },
  b: { left: '-2%', top: '0%', width: '100%', height: '100%', opacity: 0.5 },
  m: { left: '-2%', top: '0%', width: '100%', height: '100%', opacity: 0.4 },
  '.': { left: '-2%', top: '0%', width: '100%', height: '100%', opacity: 0.3 }
};

const videos = {};
const keysDown = new Set();
let meCommitted = false;
let meDelayTimeout = null;

// Create video elements
for (const [key, src] of Object.entries(VIDEO_MAPPING)) {
  const vid = document.createElement('video');
  vid.src = src;
  vid.muted = false;
  vid.preload = 'auto';
  document.body.appendChild(vid);
  videos[key] = vid;
}

// Helper to apply position & size
function setVideoPos(video, pos) {
  video.style.left = pos.left;
  video.style.top = pos.top;
  video.style.width = pos.width;
  video.style.height = pos.height;
  if (pos.opacity !== undefined) video.style.opacity = pos.opacity;
}

// Reset all videos to initial state
function resetVideos() {
  for (const vid of Object.values(videos)) {
    // Fade out
    vid.style.transition = 'opacity 1s ease-in-out';
    vid.style.opacity = 0;
  }

  // After fade-out, hide and reset everything
  setTimeout(() => {
    for (const [key, vid] of Object.entries(videos)) {
      vid.pause();
      vid.currentTime = 0;
      vid.style.display = 'none';
      vid.style.transition = 'all 1s ease-in-out'; // reset transition
      setVideoPos(vid, START_POS[key]);
    }
    keysDown.clear();
    meCommitted = false;
    if (meDelayTimeout) {
      clearTimeout(meDelayTimeout);
      meDelayTimeout = null;
    }
  }, 1000); // matches fade duration
}

// Key handling
document.addEventListener('keydown', e => {
  const key = e.key.toLowerCase();
  if (!VIDEO_MAPPING[key] || keysDown.has(key)) return;
  keysDown.add(key);

  const vid = videos[key];
  setVideoPos(vid, START_POS[key]);
  vid.style.display = 'block';
  vid.style.opacity = 1; // reset opacity in case it faded
  vid.currentTime = 0;
  vid.play();

  // Commit ME phase if all 5 keys pressed
  if (keysDown.size === 5 && !meCommitted) {
    meCommitted = true;
    // Wait 5 seconds before moving to ME
    meDelayTimeout = setTimeout(() => {
      for (const k of Object.keys(videos)) {
        setVideoPos(videos[k], ME_POS[k]);
      }
    }, 5000);
  }
});

document.addEventListener('keyup', e => {
  const key = e.key.toLowerCase();
  if (!VIDEO_MAPPING[key]) return;
  keysDown.delete(key);

  // If ME not committed yet, stop video when key released
  if (!meCommitted) {
    const vid = videos[key];
    vid.pause();
    vid.style.display = 'none';
  }
});

// Check if all videos finished playing to reset
function checkVideosEnd() {
  if (!meCommitted) {
    requestAnimationFrame(checkVideosEnd);
    return;
  }
  let allEnded = true;
  for (const vid of Object.values(videos)) {
    if (!vid.ended) allEnded = false;
  }
  if (allEnded) {
    resetVideos();
  }
  requestAnimationFrame(checkVideosEnd);
}
requestAnimationFrame(checkVideosEnd);
</script>
</body>
</html>
