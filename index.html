<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vocalsynth Combined</title>
<style>
body {
    margin:0;
    background:black;
    overflow:hidden;
    font-family: monospace;
}
#stage {
    position:absolute;
    top:0;
    left:33vw;
    width:34vw;
    height:100vh;
    overflow:hidden;
    background:#111;
}

/* Combined video */
video {
    position:absolute;
    object-fit:cover;
    transition: all 2s ease-in-out;
}
</style>
</head>
<body>

<div id="stage">
    <video id="video" src="vocalsynth_combined.mp4" muted></video>
</div>

<script>
// ================= CONFIG =================
const video = document.getElementById("video");

// Initial scattered positions (YOU) - percentages relative to stage
const startPositions = [
    {x:10, y:10, width:45, height:45}, // Ethan (Z)
    {x:55, y:10, width:45, height:45}, // Bryan (C)
    {x:10, y:55, width:45, height:45}, // Dad (B)
    {x:55, y:55, width:45, height:45}, // Monsang (M)
    {x:32.5, y:32.5, width:35, height:35} // Mom (.)
];

// Face positions (ME)
const facePositions = [
    {x:10, y:10, width:60, height:60},  // Ethan - left eye
    {x:60, y:10, width:60, height:60},  // Bryan - right eye
    {x:35, y:45, width:70, height:70},  // Dad - nose
    {x:15, y:65, width:50, height:50},  // Monsang - mouth left
    {x:55, y:65, width:50, height:50}   // Mom - mouth right
];

// ================= STATE =================
let keysDown = new Set();
let meCommitted = false;
let pauseAnimStarted = false;

// ================= UTILS =================
function applyPos(pos) {
    video.style.left = pos.x + '%';
    video.style.top = pos.y + '%';
    video.style.width = pos.width + '%';
    video.style.height = pos.height + '%';
}

// ================= INPUT =================
document.addEventListener('keydown', (e)=>{
    const key = e.key.toLowerCase();
    if(!['z','c','b','m','.'].includes(key)) return;
    keysDown.add(key);

    // Show video if first key
    if(video.style.display !== 'block') {
        video.style.display = 'block';
        video.currentTime = 0;
        video.muted = false;
        video.play();
    }

    // Commit ME if all keys pressed
    if(keysDown.size === 5 && !meCommitted) {
        meCommitted = true;
    }
});

document.addEventListener('keyup', (e)=>{
    const key = e.key.toLowerCase();
    if(!['z','c','b','m','.'].includes(key)) return;
    keysDown.delete(key);
});

// ================= ANIMATION LOOP =================
function update() {
    if(!meCommitted) {
        // YOU phase: scattered
        applyPos({x:0,y:0,width:34,height:100}); // Video fills stage initially
    } else if(meCommitted && !pauseAnimStarted) {
        // Start PAUSE -> animate to face
        pauseAnimStarted = true;
        // animate using CSS transition
        // each face part is represented as a crop in the combined video
        // for simplicity, we just move the video to ME final position
        // in real case, use multiple videos or canvas to crop
        applyPos({x:0,y:0,width:100,height:100}); // fill stage
    }
    requestAnimationFrame(update);
}

requestAnimationFrame(update);
</script>
</body>
</html>
