<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocalsynth</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; overflow:hidden; font-family:Arial, sans-serif; display:flex; justify-content:center; align-items:center; height:100vh; }

    #stage {
        position: relative;
        width: 33.333vw;   /* middle 1/3 horizontally */
        height: 100vh;     /* full height */
        background: #111;
        overflow: hidden;
    }

    video {
        position: absolute;
        object-fit: cover;
        opacity: 0;
        transition: opacity 0.2s, left 0.2s, top 0.2s, width 0.2s, height 0.2s;
    }

    video.active {
        opacity: 1;
    }

    #info {
        position: fixed;
        top:10px; right:10px;
        color:#fff;
        font-family:monospace;
        font-size:14px;
        background:rgba(0,0,0,0.7);
        padding:10px;
        border-radius:5px;
    }
</style>
</head>
<body>
<div id="stage"></div>
<div id="info">
    Phase: <span id="phase">YOU</span><br>
    Keys held: <span id="keys">0/5</span><br>
    ME committed: <span id="committed">NO</span>
</div>

<script>
// ================= CONFIGURATION =================
const VIDEO_MAPPING = {
    'z':'vocalsynth_ethan.mp4',
    'c':'vocalsynth_bryan.mp4',
    'b':'vocalsynth_dad.mp4',
    'm':'vocalsynth_monsang.mp4',
    '.':'vocalsynth_mom.mp4'
};

// Scattered positions (YOU phase)
const SCATTERED_POS = {
    'z': {x:10,y:10,width:35,height:35},
    'c': {x:55,y:10,width:35,height:35},
    'b': {x:10,y:55,width:35,height:35},
    'm': {x:55,y:55,width:35,height:35},
    '.': {x:32.5,y:32.5,width:35,height:35}
};

// Face positions (ME phase)
const FACE_POS = {
    'z': {x:15,y:20,width:30,height:30},
    'c': {x:55,y:20,width:30,height:30},
    'b': {x:35,y:40,width:30,height:30},
    'm': {x:20,y:60,width:25,height:25},
    '.': {x:55,y:60,width:25,height:25}
};

// ================= STATE =================
const state = {
    keysDown: new Set(),
    videoElements: {},
    meCommitted:false,
    pauseStart:null,
    meStarted:false,
    animationFrame:null
};

// ================= INITIALIZE =================
const stage = document.getElementById('stage');
for(const [key,file] of Object.entries(VIDEO_MAPPING)){
    const vid = document.createElement('video');
    vid.src = file;
    vid.muted = true;
    vid.style.display='none';
    vid.preload='auto';
    stage.appendChild(vid);
    state.videoElements[key] = vid;
}

// ================= UTILITY =================
function lerp(a,b,t){return a+(b-a)*t;}
function applyPos(vid,pos){
    vid.style.left = pos.x+'%';
    vid.style.top = pos.y+'%';
    vid.style.width = pos.width+'%';
    vid.style.height = pos.height+'%';
}

// ================= KEY HANDLERS =================
document.addEventListener('keydown', e=>{
    const key = e.key.toLowerCase();
    if(!VIDEO_MAPPING[key] || state.keysDown.has(key)) return;
    state.keysDown.add(key);
    const vid = state.videoElements[key];
    if(!state.meCommitted){
        vid.style.display='block';
        vid.classList.add('active');
        applyPos(vid, SCATTERED_POS[key]);
        vid.currentTime=0;
        vid.muted=false;
        vid.play().catch(()=>{});
        // Check for ME commit
        if(state.keysDown.size===5){
            state.meCommitted=true;
            state.pauseStart=performance.now();
        }
    }
    updateUI();
});

document.addEventListener('keyup', e=>{
    const key = e.key.toLowerCase();
    if(!VIDEO_MAPPING[key]) return;
    state.keysDown.delete(key);
    const vid = state.videoElements[key];
    if(!state.meCommitted){
        vid.pause();
        vid.currentTime=0;
        vid.style.display='none';
        vid.classList.remove('active');
    }
    updateUI();
});

// ================= ANIMATION LOOP =================
function update(){
    const now = performance.now();
    // PAUSE phase: move from scattered to face positions
    if(state.meCommitted && !state.meStarted){
        const elapsed = (now - state.pauseStart)/1000;
        const t = Math.min(elapsed/2,1); // 2s animation
        for(const key of Object.keys(VIDEO_MAPPING)){
            const vid = state.videoElements[key];
            if(vid.style.display==='none') continue;
            const s = SCATTERED_POS[key];
            const f = FACE_POS[key];
            const pos = {
                x: lerp(s.x,f.x,t),
                y: lerp(s.y,f.y,t),
                width: lerp(s.width,f.width,t),
                height: lerp(s.height,f.height,t)
            };
            applyPos(vid,pos);
        }
        if(t===1) state.meStarted=true;
    }
    // ME phase: stop everything when all videos ended
    if(state.meStarted){
        let allEnded=true;
        for(const vid of Object.values(state.videoElements)){
            if(vid.style.display!=='none' && !vid.ended){
                allEnded=false;
                break;
            }
        }
        if(allEnded){
            reset();
            return;
        }
    }

    state.animationFrame=requestAnimationFrame(update);
}

// ================= RESET =================
function reset(){
    for(const vid of Object.values(state.videoElements)){
        vid.pause();
        vid.currentTime=0;
        vid.muted=true;
        vid.style.display='none';
        vid.classList.remove('active');
    }
    state.keysDown.clear();
    state.meCommitted=false;
    state.pauseStart=null;
    state.meStarted=false;
    updateUI();
}

// ================= UI =================
function updateUI(){
    document.getElementById('phase').textContent = state.meCommitted ? (state.meStarted ? 'ME':'PAUSE'):'YOU';
    document.getElementById('keys').textContent = state.keysDown.size+'/5';
    document.getElementById('committed').textContent = state.meCommitted?'YES':'NO';
}

requestAnimationFrame(update);
</script>
</body>
</html>
