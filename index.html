<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vocalsynth – V.4.3</title>

<style>
body {
  background: black;
  margin: 0;
  overflow: hidden;
}

#stage {
  position: absolute;
  top: 2cm;
  bottom: 2cm;
  left: 33vw;
  width: 34vw;
  border: 2px solid #444;
}

/* video blocks */
.clip {
  position: absolute;
  width: 160px;
  height: 160px;
  display: none;
  object-fit: cover;
  transition: none;
}

/* starting scattered positions (YOU) */
.start-z { left: 65%; top: 10%; }
.start-c { left: 15%; top: 10%; }
.start-b { left: 65%; top: 65%; }
.start-m { left: 15%; top: 65%; }
.start-dot { left: 40%; top: 40%; }

/* face positions (ME) */
.face-z { left: 35%; top: 25%; }   /* left eye */
.face-c { left: 50%; top: 25%; }   /* right eye */
.face-b { left: 42%; top: 40%; }   /* nose */
.face-m { left: 35%; top: 55%; }   /* mouth */
.face-dot { left: 50%; top: 55%; } /* mouth */

</style>
</head>

<body>

<div id="stage">

  <video id="z" class="clip start-z"
    src="vocalsynth_ethan.mp4" playsinline></video>

  <!-- C is placeholder -->
  <div id="c" class="clip start-c"
    style="background:#333;color:white;font-family:monospace;
           display:none;align-items:center;justify-content:center;">
    C
  </div>

  <video id="b" class="clip start-b"
    src="vocalsynth_dad.mp4" playsinline></video>

  <video id="m" class="clip start-m"
    src="vocalsynth_monsang.mp4" playsinline></video>

  <video id="dot" class="clip start-dot"
    src="vocalsynth_mom.mp4" playsinline></video>

</div>

<script>
/* ---------------- SETUP ---------------- */

const clips = {
  z: document.getElementById("z"),
  c: document.getElementById("c"),
  b: document.getElementById("b"),
  m: document.getElementById("m"),
  ".": document.getElementById("dot")
};

const pressed = new Set();
let clock = 0;
let committed = false;
let lastTime = performance.now();

/* ---------------- INPUT ---------------- */

document.addEventListener("keydown", e => {
  const key = e.key.toLowerCase();
  const el = clips[key];
  if (!el || pressed.has(key)) return;

  pressed.add(key);
  el.style.display = "block";

  if (el.tagName === "VIDEO") {
    el.currentTime = 0;
    el.play();
  }

  if (pressed.size === 1 && !committed) clock = 0;
});

document.addEventListener("keyup", e => {
  const key = e.key.toLowerCase();
  if (!clips[key]) return;

  pressed.delete(key);

  if (!committed) {
    const el = clips[key];
    el.style.display = "none";
    if (el.tagName === "VIDEO") el.pause();
  }
});

/* ---------------- ANIMATION LOOP ---------------- */

function update(now) {
  const dt = (now - lastTime) / 1000;
  lastTime = now;

  if (pressed.size > 0 || committed) clock += dt;

  // YOU loop prevention (no looping, just cap)
  if (!committed && clock > 5) clock = 5;

  // commit ME
  if (!committed && pressed.size === 5) {
    committed = true;
  }

  // MOVE + CROP during PAUSE (5–7)
  if (clock >= 5 && clock < 7) {
    const a = (clock - 5) / 2;

    Object.entries(clips).forEach(([k, el]) => {
      if (el.style.display === "none") return;

      el.style.transition = "left 0.1s linear, top 0.1s linear";
      el.classList.remove("start-" + k);
      el.classList.add("face-" + k);

      // crop illusion
      if (el.tagName === "VIDEO") {
        el.style.objectPosition =
          `${50 + (Math.random() * 20 - 10)}% ${50 + (Math.random() * 20 - 10)}%`;
      }
    });
  }

  // lock ME
  if (clock >= 7) {
    Object.entries(clips).forEach(([k, el]) => {
      el.classList.remove("start-" + k);
      el.classList.add("face-" + k);
    });
  }

  // RESET after ME ends
  if (committed && clock >= 12) {
    clock = 0;
    committed = false;
    pressed.clear();

    Object.values(clips).forEach(el => {
      el.style.display = "none";
      if (el.tagName === "VIDEO") {
        el.pause();
        el.currentTime = 0;
      }
    });
  }

  requestAnimationFrame(update);
}

requestAnimationFrame(update);
</script>

</body>
</html>
