<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Vocalsynth V.3.1</title>

<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
  }

  /* ===== SCREEN AREA ===== */
  #screen {
    position: absolute;
    left: 33.33vw;              /* middle 1/3 horizontally */
    width: 33.33vw;
    top: 2cm;
    bottom: 2cm;
    overflow: hidden;
  }

  /* ===== VIDEO BASE ===== */
  .vid {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
    transition:
      top 2s ease,
      left 2s ease,
      width 2s ease,
      height 2s ease,
      object-position 2s ease;
  }

  /* ===== FACE FORMATION (during PAUSE) ===== */
  .face-z   { top: 0%;   left: 25%; width: 50%; height: 40%; object-position: center top; }
  .face-c   { top: 40%;  left: 0%;  width: 50%; height: 30%; object-position: left center; }
  .face-b   { top: 40%;  left: 50%; width: 50%; height: 30%; object-position: right center; }
  .face-m   { top: 70%;  left: 25%; width: 50%; height: 30%; object-position: center bottom; }
  .face-dot { top: 25%;  left: 25%; width: 50%; height: 50%; object-position: center center; }
</style>
</head>

<body>

<div id="screen">

  <video id="v_z"   class="vid" src="vocalsynth_ethan.mp4"   playsinline></video>
  <!-- c intentionally skipped -->
  <video id="v_b"   class="vid" src="vocalsynth_dad.mp4"     playsinline></video>
  <video id="v_m"   class="vid" src="vocalsynth_monsang.mp4" playsinline></video>
  <video id="v_dot" class="vid" src="vocalsynth_mom.mp4"     playsinline></video>

</div>

<script>
/* ===== TIMING (seconds) ===== */
const YOU_END   = 5;
const PAUSE_END = 7;
const ME_END    = 12;

/* ===== VIDEO MAP ===== */
const videos = {
  z:   document.getElementById("v_z"),
  b:   document.getElementById("v_b"),
  m:   document.getElementById("v_m"),
  ".": document.getElementById("v_dot")
  // c intentionally omitted
};

const faceClasses = {
  z:   "face-z",
  c:   "face-c",
  b:   "face-b",
  m:   "face-m",
  ".": "face-dot"
};

const activeKeys = new Set();
let meCommitted = false;
let faceScheduled = false;
let unlock = false;

/* ===== UNLOCK AUTOPLAY ===== */
document.addEventListener("click", () => unlock = true);

/* ===== KEYDOWN ===== */
document.addEventListener("keydown", e => {
  if (!unlock || meCommitted) return;

  const k = e.key.toLowerCase();
  const v = videos[k];
  if (!v || activeKeys.has(k)) return;

  activeKeys.add(k);

  v.style.display = "block";
  v.muted = false;
  v.volume = 1;

  if (v.paused) v.play();

  checkAllPressed();
});

/* ===== KEYUP ===== */
document.addEventListener("keyup", e => {
  if (meCommitted) return;

  const k = e.key.toLowerCase();
  const v = videos[k];
  if (!v) return;

  activeKeys.delete(k);
  v.pause();
  v.currentTime = 0;
  v.style.display = "none";
});

/* ===== LOOP CONTROL ===== */
setInterval(() => {
  if (meCommitted) return;

  Object.values(videos).forEach(v => {
    if (v.paused || v.currentTime < YOU_END) return;
    if (activeKeys.size < 4) v.currentTime = 0; // YOU loop
  });
}, 50);

/* ===== ALL PRESSED LOGIC ===== */
function checkAllPressed() {
  if (activeKeys.size === 4 && !faceScheduled) {
    faceScheduled = true;
    syncAndScheduleFace();
  }
}

function syncAndScheduleFace() {
  const master = videos.z.currentTime;

  Object.values(videos).forEach(v => v.currentTime = master);

  const delay =
    master < YOU_END
      ? YOU_END - master
      : ME_END - master + YOU_END;

  setTimeout(() => {
    moveToFace();
    setTimeout(startMePhase, (PAUSE_END - YOU_END) * 1000);
  }, delay * 1000);
}

/* ===== FACE MOVE ===== */
function moveToFace() {
  Object.entries(videos).forEach(([k, v]) => {
    v.classList.add(faceClasses[k]);
  });
}

/* ===== ME PHASE ===== */
function startMePhase() {
  meCommitted = true;
  Object.values(videos).forEach(v => v.play());

  const checkEnd = setInterval(() => {
    if (videos.z.currentTime >= ME_END) {
      clearInterval(checkEnd);
      resetAll();
    }
  }, 100);
}

/* ===== RESET ===== */
function resetAll() {
  meCommitted = false;
  faceScheduled = false;
  activeKeys.clear();

  Object.entries(videos).forEach(([k, v]) => {
    v.pause();
    v.currentTime = 0;
    v.style.display = "none";
    v.classList.remove(faceClasses[k]);
  });
}
</script>

</body>
</html>
