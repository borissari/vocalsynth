<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vocalsynth vv11</title>
<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: monospace;
  }
  #stage {
    position: absolute;
    top: 0;
    left: 33.333vw;
    width: 33.333vw;
    height: 100vh;
    overflow: hidden;
    background: #111;
  }
  video {
    position: absolute;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.2s;
    transform-origin: top left;
  }
  video.active {
    opacity: 1;
  }
</style>
</head>
<body>
<div id="stage"></div>

<script>
const VIDEO_MAPPING = {
  'z': 'vocalsynth_ethan.mp4',
  'c': 'vocalsynth_bryan.mp4',
  'b': 'vocalsynth_dad.mp4',
  'm': 'vocalsynth_monsang.mp4',
  '.': 'vocalsynth_mom.mp4'
};

// Initial scattered positions (%)
const SCATTERED_POS = {
  'z': { x: 5, y: 5, width: 40, height: 40 },
  'c': { x: 55, y: 5, width: 40, height: 40 },
  'b': { x: 5, y: 55, width: 40, height: 40 },
  'm': { x: 55, y: 55, width: 40, height: 40 },
  '.': { x: 32.5, y: 32.5, width: 40, height: 40 }
};

// ME positions and crop (top-left, top-right, bottom-left, bottom-right, center)
const FACE_POS = {
  'z': { x: 0, y: 0, width: 50, height: 50, clip: 'rect(0px,50%,50%,0px)' },       // top-left
  'c': { x: '50%', y: 0, width: 50, height: 50, clip: 'rect(0px,100%,50%,50%)' },  // top-right
  'b': { x: 25, y: 25, width: 50, height: 50, clip: 'rect(25%,75%,75%,25%)' },     // center
  'm': { x: 0, y: '50%', width: 50, height: 50, clip: 'rect(50%,50%,100%,0%)' },   // bottom-left
  '.': { x: '50%', y: '50%', width: 50, height: 50, clip: 'rect(50%,100%,100%,50%)' } // bottom-right
};

const stage = document.getElementById('stage');
const state = {
  keysDown: new Set(),
  videos: {},
  meCommitted: false,
  pauseStart: null,
  meStarted: false
};

// Create video elements
for(const [key, src] of Object.entries(VIDEO_MAPPING)){
  const v = document.createElement('video');
  v.src = src;
  v.muted = false;
  v.style.display = 'none';
  v.preload = 'auto';
  stage.appendChild(v);
  state.videos[key] = v;
}

// Utility functions
function lerp(a, b, t){ return a + (b-a)*t; }
function applyPos(video,pos){
  video.style.left = typeof pos.x==='number'? pos.x+'%':pos.x;
  video.style.top = typeof pos.y==='number'? pos.y+'%':pos.y;
  video.style.width = pos.width+'%';
  video.style.height = pos.height+'%';
  if(pos.clip) video.style.clip = pos.clip;
}

// Key handling
document.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  if(!VIDEO_MAPPING[k] || state.keysDown.has(k)) return;
  state.keysDown.add(k);
  const v = state.videos[k];
  v.style.display='block';
  v.classList.add('active');
  applyPos(v, SCATTERED_POS[k]);
  v.currentTime = 0;
  v.play();
  if(state.keysDown.size===5 && !state.meCommitted){
    state.meCommitted=true;
    state.pauseStart = performance.now();
  }
});

document.addEventListener('keyup', e=>{
  const k = e.key.toLowerCase();
  if(!VIDEO_MAPPING[k]) return;
  state.keysDown.delete(k);
  if(!state.meCommitted){
    const v = state.videos[k];
    v.pause();
    v.style.display='none';
    v.classList.remove('active');
  }
});

// Animation loop
function update(){
  const now = performance.now();
  // PAUSE animation
  if(state.meCommitted && !state.meStarted){
    const elapsed = (now - state.pauseStart)/1000;
    const t = Math.min(elapsed/2,1); // 2 seconds
    for(const [k,v] of Object.entries(state.videos)){
      if(v.style.display==='none') continue;
      const s = SCATTERED_POS[k];
      const f = FACE_POS[k];
      const pos = {
        x: lerp(s.x, f.x, t),
        y: lerp(s.y, f.y, t),
        width: lerp(s.width, f.width, t),
        height: lerp(s.height, f.height, t),
        clip: f.clip
      };
      applyPos(v,pos);
    }
    if(t===1) state.meStarted=true;
  }
  requestAnimationFrame(update);
}
requestAnimationFrame(update);
</script>
</body>
</html>
