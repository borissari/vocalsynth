<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YOU → PAUSE → ME (Stable)</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
}

/* Stage = middle 1/3 width, full height */
#stage {
  position: absolute;
  left: 33.333vw;
  width: 33.333vw;
  height: 100vh;
  overflow: hidden;
  background: #111;
}

/* Video base */
video {
  position: absolute;
  object-fit: cover;
  opacity: 0;
  transition: none;
}
</style>
</head>

<body>

<div id="stage"></div>

<script>
/* ---------------- CONFIG ---------------- */

const FILES = {
  z: "vocalsynth_ethan.mp4",
  c: "vocalsynth_bryan.mp4",
  b: "vocalsynth_dad.mp4",
  m: "vocalsynth_monsang.mp4",
  ".": "vocalsynth_mom.mp4"
};

/* YOU positions (scattered) */
const YOU = {
  z:{x:5,y:5,w:40,h:40},
  c:{x:55,y:5,w:40,h:40},
  b:{x:5,y:55,w:40,h:40},
  m:{x:55,y:55,w:40,h:40},
  ".":{x:30,y:30,w:40,h:40}
};

/* ME target (all overlap & fill height) */
const ME = {
  x:0,
  y:0,
  w:100,
  h:100
};

/* ---------------- STATE ---------------- */

const stage = document.getElementById("stage");
const vids = {};
const keys = new Set();

let phase = "YOU";
let pauseStart = 0;

/* ---------------- SETUP ---------------- */

for (const k in FILES) {
  const v = document.createElement("video");
  v.src = FILES[k];
  v.preload = "auto";
  v.muted = false;
  v.playsInline = true;
  stage.appendChild(v);
  vids[k] = v;
}

/* ---------------- HELPERS ---------------- */

function setRect(v, r) {
  v.style.left = r.x + "%";
  v.style.top = r.y + "%";
  v.style.width = r.w + "%";
  v.style.height = r.h + "%";
}

function lerp(a,b,t){ return a+(b-a)*t; }

/* ---------------- INPUT ---------------- */

document.addEventListener("keydown", e=>{
  const k = e.key.toLowerCase();
  if (!vids[k] || keys.has(k)) return;

  keys.add(k);
  const v = vids[k];

  setRect(v, YOU[k]);
  v.style.opacity = 0.5;
  v.style.display = "block";
  v.play();

  if (keys.size === 5 && phase === "YOU") {
    phase = "PAUSE";
    pauseStart = performance.now();
  }
});

document.addEventListener("keyup", e=>{
  const k = e.key.toLowerCase();
  if (!vids[k]) return;

  keys.delete(k);
  if (phase === "YOU") {
    vids[k].pause();
    vids[k].style.opacity = 0;
  }
});

/* ---------------- LOOP ---------------- */

function loop(now){
  if (phase === "PAUSE") {
    const t = Math.min((now - pauseStart)/2000,1);

    for (const k in vids) {
      const v = vids[k];
      const a = YOU[k];

      setRect(v,{
        x:lerp(a.x,ME.x,t),
        y:lerp(a.y,ME.y,t),
        w:lerp(a.w,ME.w,t),
        h:lerp(a.h,ME.h,t)
      });

      v.style.opacity = lerp(0.5,0.85,t);
    }

    if (t===1) phase="ME";
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>

</body>
</html>
