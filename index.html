<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vocalsynth V.3.4</title>

<style>
  body {
    background: black;
    margin: 0;
    overflow: hidden;
  }

  #stage {
    position: absolute;
    top: 2cm;
    bottom: 2cm;
    left: 33vw;
    width: 34vw;
    overflow: hidden;
  }

  video, .placeholder {
    position: absolute;
    width: 40%;
    height: 40%;
    object-fit: cover;
    display: none;
  }

  .placeholder {
    background: #222;
    border: 2px solid #666;
  }
</style>
</head>

<body>

<div id="stage">
  <video id="z" src="vocalsynth_ethan.mp4" playsinline></video>
  <div id="c" class="placeholder"></div>
  <video id="b" src="vocalsynth_dad.mp4" playsinline></video>
  <video id="m" src="vocalsynth_monsang.mp4" playsinline></video>
  <video id="dot" src="vocalsynth_mom.mp4" playsinline></video>
</div>

<script>
const items = {
  z: document.getElementById("z"),
  c: document.getElementById("c"), // placeholder
  b: document.getElementById("b"),
  m: document.getElementById("m"),
  ".": document.getElementById("dot")
};

const pressed = new Set();
let clock = 0;
let meCommitted = false;
let lastTime = performance.now();

// YOU positions
const startPos = { z:{x:55,y:5}, c:{x:45,y:5}, b:{x:55,y:55}, m:{x:5,y:55}, ".":{x:5,y:5} };
// ME positions (face)
const facePos  = { z:{x:30,y:25}, c:{x:50,y:30}, b:{x:45,y:40}, m:{x:30,y:55}, ".":{x:45,y:55} };

function setPosition(el,pos){el.style.left=pos.x+"%";el.style.top=pos.y+"%";}

document.addEventListener("keydown", e=>{
  const key = e.key.toLowerCase();
  if(!items[key]||pressed.has(key)) return;
  pressed.add(key);
  items[key].style.display="block";
  setPosition(items[key], startPos[key]);
  if(pressed.size===1 && !meCommitted) clock=0;
});

document.addEventListener("keyup", e=>{
  const key = e.key.toLowerCase();
  if(!items[key]) return;
  pressed.delete(key);
  if(!meCommitted) items[key].style.display="none";
});

function update(now){
  const dt=(now-lastTime)/1000;
  lastTime=now;

  const activeCount=pressed.size;

  if(activeCount>0 || meCommitted) clock+=dt;

  // YOU loop 1-5
  if(!meCommitted && activeCount<5){
    if(clock>=5) clock=1;
  }

  // commit ME
  if(!meCommitted && activeCount===5) meCommitted=true;

  // motion during PAUSE
  if(clock>=5 && clock<7){
    const alpha=(clock-5)/2;
    Object.entries(items).forEach(([k,v])=>{
      if(v.style.display==="none") return;
      const a=startPos[k], b=facePos[k];
      setPosition(v,{x:a.x+(b.x-a.x)*alpha, y:a.y+(b.y-a.y)*alpha});
    });
  }

  // lock ME
  if(clock>=7){
    Object.entries(items).forEach(([k,v])=>{
      if(v.style.display==="none") return;
      setPosition(v, facePos[k]);
    });
  }

  // update video time to match clock
  Object.entries(items).forEach(([k,v])=>{
    if(v.tagName==="VIDEO" && v.style.display!=="none"){
      if(!meCommitted && activeCount<5){
        // loop YOU 1-5
        v.currentTime=Math.min(Math.max(clock,1),5);
      } else {
        // PAUSE+ME
        v.currentTime=Math.min(clock,12);
      }
    }
  });

  // END RESET
  if(meCommitted && clock>=12){
    clock=0; meCommitted=false; pressed.clear();
    Object.values(items).forEach(v=>{
      v.style.display="none";
    });
  }

  requestAnimationFrame(update);
}

requestAnimationFrame(update);
</script>

</body>
</html>
