<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>vocalsynth V.3.2</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
  font-family: monospace;
}

/* ===== SCREEN ===== */
#screen {
  position: absolute;
  left: 33.33vw;
  width: 33.33vw;
  top: 2cm;
  bottom: 2cm;
}

/* ===== PLAYER WRAPPER ===== */
.player {
  position: absolute;
  width: 100%;
  height: 100%;
  display: none;
  overflow: hidden;
  transition: all 2s ease;
}

/* ===== VIDEO ===== */
.player video {
  width: 130%;
  height: 130%;
  object-fit: cover;
  transition: transform 2s ease;
}

/* ===== SQUARE (C) ===== */
.square {
  width: 100%;
  height: 100%;
  background: #aaa;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

/* ===== FACE POSITIONS ===== */
.face-z   { top: 0%;   left: 25%; width: 50%; height: 35%; }
.face-c   { top: 35%;  left: 0%;  width: 50%; height: 30%; }
.face-b   { top: 35%;  left: 50%; width: 50%; height: 30%; }
.face-m   { top: 65%;  left: 25%; width: 50%; height: 35%; }
.face-dot { top: 25%;  left: 25%; width: 50%; height: 50%; }

/* ===== CROPS ===== */
.crop-z   video { transform: translateY(-10%); }
.crop-b   video { transform: translateX(-15%); }
.crop-m   video { transform: translateY(-25%); }
.crop-dot video { transform: scale(1.1); }

</style>
</head>

<body>

<div id="screen">

  <div id="p_z" class="player">
    <video src="vocalsynth_ethan.mp4"></video>
  </div>

  <div id="p_c" class="player">
    <div class="square" id="square_c"></div>
  </div>

  <div id="p_b" class="player">
    <video src="vocalsynth_dad.mp4"></video>
  </div>

  <div id="p_m" class="player">
    <video src="vocalsynth_monsang.mp4"></video>
  </div>

  <div id="p_dot" class="player">
    <video src="vocalsynth_mom.mp4"></video>
  </div>

</div>

<script>
/* ===== TIME ===== */
const YOU_START = 1;
const YOU_END = 5;
const PAUSE_END = 7;
const ME_END = 12;

/* ===== PLAYERS ===== */
const players = {
  z:   { el: p_z,   video: p_z.querySelector("video"), time: 1 },
  c:   { el: p_c,   video: null, time: 1 },
  b:   { el: p_b,   video: p_b.querySelector("video"), time: 1 },
  m:   { el: p_m,   video: p_m.querySelector("video"), time: 1 },
  ".": { el: p_dot, video: p_dot.querySelector("video"), time: 1 }
};

const active = new Set();
let faceMode = false;
let meCommitted = false;

/* ===== CLOCK ===== */
setInterval(() => {
  Object.entries(players).forEach(([k, p]) => {
    if (!active.has(k) && !meCommitted) return;

    p.time += 0.016;

    if (!meCommitted && active.size < 5 && p.time > YOU_END) {
      p.time = YOU_START;
      if (p.video) p.video.currentTime = YOU_START;
    }

    if (meCommitted && p.time > ME_END) resetAll();

    if (k === "c") {
      square_c.innerHTML = `
        <div>${phase(p.time)}</div>
        <div>${p.time.toFixed(2)}s</div>
      `;
    }
  });
}, 16);

function phase(t) {
  if (t < YOU_END) return "YOU";
  if (t < PAUSE_END) return "PAUSE";
  return "ME";
}

/* ===== INPUT ===== */
document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (!(k in players) || active.has(k)) return;

  active.add(k);
  const p = players[k];
  p.el.style.display = "block";

  if (p.video) {
    p.video.currentTime = p.time;
    p.video.play();
  }

  if (active.size === 5) triggerFaceMode();
});

document.addEventListener("keyup", e => {
  if (meCommitted) return;
  const k = e.key.toLowerCase();
  if (!(k in players)) return;

  active.delete(k);
  players[k].el.style.display = "none";
});

/* ===== FACE MODE ===== */
function triggerFaceMode() {
  faceMode = true;

  const master = players.z.time;
  Object.values(players).forEach(p => {
    p.time = master;
    if (p.video) p.video.currentTime = master;
  });

  setTimeout(() => {
    Object.entries(players).forEach(([k, p]) => {
      p.el.classList.add(`face-${k === "." ? "dot" : k}`);
      p.el.classList.add(`crop-${k === "." ? "dot" : k}`);
    });
  }, (YOU_END - master) * 1000);

  setTimeout(() => {
    meCommitted = true;
  }, (PAUSE_END - master) * 1000);
}

/* ===== RESET ===== */
function resetAll() {
  meCommitted = false;
  faceMode = false;
  active.clear();

  Object.values(players).forEach(p => {
    p.time = YOU_START;
    p.el.style.display = "none";
    p.el.className = "player";
    if (p.video) {
      p.video.pause();
      p.video.currentTime = YOU_START;
    }
  });
}
</script>

</body>
</html>
