<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vocalsynth V.3.5</title>
<style>
  body {
    background: black;
    margin: 0;
    overflow: hidden;
  }

  #stage {
    position: absolute;
    top: 2cm;
    bottom: 2cm;
    left: 33vw;
    width: 34vw;
    overflow: hidden;
  }

  video, .placeholder {
    position: absolute;
    width: 40%;
    height: 40%;
    object-fit: cover;
    display: none;
    will-change: transform;
  }

  .placeholder {
    background: #222;
    border: 2px solid #666;
  }
</style>
</head>
<body>

<div id="stage">
  <video id="z" src="vocalsynth_ethan.mp4" playsinline muted loop></video>
  <div id="c" class="placeholder"></div>
  <video id="b" src="vocalsynth_dad.mp4" playsinline muted loop></video>
  <video id="m" src="vocalsynth_monsang.mp4" playsinline muted loop></video>
  <video id="dot" src="vocalsynth_mom.mp4" playsinline muted loop></video>
</div>

<script>
const items = {
  z: document.getElementById("z"),
  c: document.getElementById("c"),
  b: document.getElementById("b"),
  m: document.getElementById("m"),
  ".": document.getElementById("dot")
};

// YOU positions (percent)
const startPos = { z:{x:55,y:5}, c:{x:45,y:5}, b:{x:55,y:55}, m:{x:5,y:55}, ".":{x:5,y:5} };
// Face positions (ME)
const facePos  = { z:{x:30,y:25}, c:{x:50,y:30}, b:{x:45,y:40}, m:{x:30,y:55}, ".":{x:45,y:55} };

let pressed = new Set();
let clock = 0;
let meCommitted = false;
let lastTime = performance.now();

document.addEventListener("click", ()=>{
  // unmute all videos on first click
  Object.values(items).forEach(v=>{if(v.tagName==="VIDEO") v.muted=false;});
});

document.addEventListener("keydown", e=>{
  const key = e.key.toLowerCase();
  if(!items[key] || pressed.has(key)) return;
  pressed.add(key);
  const el = items[key];
  el.style.display = "block";
  el.style.transform = `translate(${startPos[key].x}%,${startPos[key].y}%)`;
  if(el.tagName==="VIDEO") el.currentTime=0, el.play();
  if(pressed.size===1 && !meCommitted) clock=0;
});

document.addEventListener("keyup", e=>{
  const key = e.key.toLowerCase();
  if(!items[key]) return;
  pressed.delete(key);
  if(!meCommitted) {
    const el = items[key];
    el.style.display = "none";
    if(el.tagName==="VIDEO") el.pause();
  }
});

function lerp(a,b,t){return a+(b-a)*t;}

function update(now){
  const dt=(now-lastTime)/1000;
  lastTime=now;
  const activeCount=pressed.size;

  if(activeCount>0 || meCommitted) clock+=dt;

  // YOU loop 1-5
  if(!meCommitted && activeCount<5){
    if(clock>=5) clock=1;
  }

  // commit ME
  if(!meCommitted && activeCount===5) meCommitted=true;

  // PAUSE phase motion (5-7s)
  if(clock>=5 && clock<7){
    const alpha=(clock-5)/2;
    Object.entries(items).forEach(([k,v])=>{
      if(v.style.display==="none") return;
      const sx=startPos[k].x, sy=startPos[k].y;
      const ex=facePos[k].x, ey=facePos[k].y;
      v.style.transform = `translate(${lerp(sx,ex,alpha)}%,${lerp(sy,ey,alpha)}%)`;
    });
  }

  // ME lock (7-12s)
  if(clock>=7){
    Object.entries(items).forEach(([k,v])=>{
      if(v.style.display==="none") return;
      const p = facePos[k];
      v.style.transform = `translate(${p.x}%,${p.y}%)`;
    });
  }

  // RESET
  if(meCommitted && clock>=12){
    clock=0;
    meCommitted=false;
    pressed.clear();
    Object.values(items).forEach(v=>{
      v.style.display="none";
      if(v.tagName==="VIDEO") v.pause();
    });
  }

  requestAnimationFrame(update);
}

requestAnimationFrame(update);
</script>
</body>
</html>
