<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vocalsynth V7</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
  }

  #stage {
    position: absolute;
    left: 33.333vw; /* middle third of screen */
    width: 33.333vw;
    height: 100vh;
    background: #111;
    overflow: hidden;
  }

  video {
    position: absolute;
    object-fit: cover;
    transition: all 2s ease; /* smooth movement */
  }

  #info {
    position: fixed;
    top: 10px;
    left: 10px;
    color: #fff;
    font-family: monospace;
  }
</style>
</head>
<body>

<div id="stage"></div>
<div id="info">
  Keys pressed: <span id="keys">0</span><br>
  Phase: <span id="phase">YOU</span>
</div>

<script>
const VIDEO_MAPPING = {
  z: 'vs_ethan.mp4',
  c: 'vs_bryan.mp4',
  b: 'vs_dad.mp4',
  m: 'vs_monsang.mp4',
  '.': 'vs_mom.mp4'
};

const SCATTERED = {
  z: {x:10, y:10, width:35, height:35},
  c: {x:55, y:10, width:35, height:35},
  b: {x:10, y:55, width:35, height:35},
  m: {x:55, y:55, width:35, height:35},
  '.': {x:32.5, y:32.5, width:35, height:35}
};

const state = {
  keysDown: new Set(),
  videos: {},
  meCommitted: false,
  pauseTimeout: null
};

const stage = document.getElementById('stage');

// create video elements
for (const [key, src] of Object.entries(VIDEO_MAPPING)) {
  const vid = document.createElement('video');
  vid.src = src;
  vid.muted = false;
  vid.style.display = 'none';
  vid.preload = 'auto';
  stage.appendChild(vid);
  state.videos[key] = vid;
}

// utility to set position/size
function setVideoPos(key, pos) {
  const v = state.videos[key];
  v.style.left = pos.x + '%';
  v.style.top = pos.y + '%';
  v.style.width = pos.width + '%';
  v.style.height = pos.height + '%';
  if(pos.opacity!==undefined)v.style.opacity = pos.opacity;
}

// keydown
document.addEventListener('keydown', e=>{
  const key = e.key.toLowerCase();
  if(!VIDEO_MAPPING[key] || state.keysDown.has(key)) return;
  state.keysDown.add(key);
  document.getElementById('keys').textContent = state.keysDown.size;

  const vid = state.videos[key];
  vid.style.display = 'block';
  setVideoPos(key, SCATTERED[key]);
  vid.currentTime = 0;
  vid.play();

  // all 5 pressed → delay 5s before committing ME
  if(state.keysDown.size === 5 && !state.meCommitted){
    document.getElementById('phase').textContent = 'WAITING 5s';
    state.pauseTimeout = setTimeout(()=>{
      state.meCommitted = true;
      document.getElementById('phase').textContent = 'ME PHASE';
      
      // move videos to full viewport, low opacity, ignoring stage boundaries
      for(const [k,v] of Object.entries(state.videos)){
        v.style.position = 'fixed';  // relative to viewport now
        v.style.left = '0';
        v.style.top = '0';
        v.style.height = window.innerHeight + 'px';
        v.style.width = 'auto';
        v.style.opacity = 0.3;
        v.style.transition = 'all 2s ease';
      }
    }, 5000);
  }
});

// keyup
document.addEventListener('keyup', e=>{
  const key = e.key.toLowerCase();
  if(!VIDEO_MAPPING[key]) return;
  state.keysDown.delete(key);
  document.getElementById('keys').textContent = state.keysDown.size;

  // cancel ME commit if any key released before pause
  if(!state.meCommitted && state.pauseTimeout){
    clearTimeout(state.pauseTimeout);
    state.pauseTimeout = null;
    document.getElementById('phase').textContent = 'YOU';
  }

  if(!state.meCommitted){
    const vid = state.videos[key];
    vid.pause();
    vid.currentTime = 0;
    vid.style.display = 'none';
  }
});

// monitor when all videos end
function checkVideosEnd(){
  if(state.meCommitted){
    let allEnded = true;
    for(const v of Object.values(state.videos)){
      if(!v.ended) { allEnded=false; break; }
    }
    if(allEnded){
      // reset
      for(const [k,v] of Object.entries(state.videos)){
        v.pause();
        v.currentTime = 0;
        v.style.display = 'none';
        v.style.opacity = 1;
        v.style.position = 'absolute';
        setVideoPos(k, SCATTERED[k]);
      }
      state.keysDown.clear();
      state.meCommitted = false;
      document.getElementById('phase').textContent = 'YOU';
      document.getElementById('keys').textContent = '0';
    }
  }
  requestAnimationFrame(checkVideosEnd);
}
checkVideosEnd();
</script>
</body>
</html>
