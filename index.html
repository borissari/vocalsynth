<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocalsynth V.6.1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }
        
        /* Stage container - 1/3 width, full height */
        #stage {
            position: relative;
            width: 33vw;
            height: 100vh;
            background: #111;
            overflow: hidden;
        }
        
        /* Video elements */
        video {
            position: absolute;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        video.active {
            opacity: 1;
        }
        
        /* Debug info */
        #info {
            position: fixed;
            top: 10px;
            left: 35vw;
            color: #fff;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            line-height: 1.6;
        }
        
        .pressed {
            color: #0f0;
        }
    </style>
</head>
<body>
    <div id="stage"></div>
    <div id="info">
        <div>Phase: <span id="phase">YOU</span></div>
        <div>Time: <span id="time">0.00</span>s</div>
        <div>Keys pressed: <span id="keys">0/5</span></div>
        <div style="margin-top: 10px;">
            Z: <span id="key-z">-</span><br>
            C: <span id="key-c">-</span><br>
            B: <span id="key-b">-</span><br>
            M: <span id="key-m">-</span><br>
            .: <span id="key-period">-</span>
        </div>
    </div>

    <script>
        // ==================== CONFIGURATION ====================
        const VIDEO_MAPPING = {
            'z': 'vocalsynth_ethan.mp4',
            'c': 'vocalsynth_bryan.mp4',
            'b': 'vocalsynth_dad.mp4',
            'm': 'vocalsynth_monsang.mp4',
            '.': 'vocalsynth_mom.mp4'
        };
        
        const PHASE_DURATION = {
            YOU: 5000,      // 0-5s: scattered positions
            PAUSE: 2000,    // 5-7s: smooth transition
            ME: 5000        // 7-12s: final combined face
        };
        
        // Final positions for ME phase (as percentages of stage)
        const FINAL_POSITIONS = {
            'z': { x: 0, y: 0, width: 90, height: 90, clip: 'inset(0 50% 50% 0)' },        // top-left
            'b': { x: 50, y: 0, width: 90, height: 90, clip: 'inset(0 0 50% 50%)' },       // top-right
            'm': { x: 0, y: 50, width: 90, height: 90, clip: 'inset(50% 50% 0 0)' },       // bottom-left
            '.': { x: 50, y: 50, width: 90, height: 90, clip: 'inset(50% 0 0 50%)' },      // bottom-right
            'c': { x: 7.5, y: 7.5, width: 85, height: 85, clip: 'inset(15% 15% 15% 15%)' } // center
        };
        
        // ==================== STATE ====================
        const state = {
            phase: 'YOU',           // Current phase: YOU, PAUSE, ME
            clock: 0,               // Time in milliseconds since first key press
            startTime: null,        // Timestamp when first key was pressed
            keysPressed: new Set(), // Which keys have been pressed
            videoElements: {},      // Video DOM elements
            scatteredPos: {},       // Initial scattered positions
            currentPos: {},         // Current interpolated positions
            isAnimating: false,     // Whether PAUSE animation is running
            keysDown: new Set(),    // Currently held down keys
            lastFrame: null         // For requestAnimationFrame
        };
        
        // ==================== INITIALIZATION ====================
        const stage = document.getElementById('stage');
        
        // Create video elements
        for (const [key, filename] of Object.entries(VIDEO_MAPPING)) {
            const video = document.createElement('video');
            video.src = filename;
            video.muted = true; // Start muted, will unmute on keypress
            video.style.display = 'none';
            stage.appendChild(video);
            state.videoElements[key] = video;
        }
        
        // ==================== UTILITY FUNCTIONS ====================
        
        // Generate random scattered position within stage
        function getRandomPosition() {
            return {
                x: Math.random() * 60 + 5,  // 5-65% from left
                y: Math.random() * 60 + 5,  // 5-65% from top
                width: 30 + Math.random() * 20, // 30-50% width
                height: 30 + Math.random() * 20 // 30-50% height
            };
        }
        
        // Apply position to video element
        function applyPosition(key, pos, clipPath = 'none') {
            const video = state.videoElements[key];
            video.style.left = `${pos.x}%`;
            video.style.top = `${pos.y}%`;
            video.style.width = `${pos.width}%`;
            video.style.height = `${pos.height}%`;
            video.style.clipPath = clipPath;
        }
        
        // Linear interpolation
        function lerp(start, end, t) {
            return start + (end - start) * t;
        }
        
        // Ease in-out cubic for smoother animation
        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }
        
        // ==================== PHASE MANAGEMENT ====================
        
        function updatePhase() {
            const elapsed = state.clock;
            
            if (elapsed < PHASE_DURATION.YOU) {
                state.phase = 'YOU';
            } else if (elapsed < PHASE_DURATION.YOU + PHASE_DURATION.PAUSE) {
                if (state.phase !== 'PAUSE') {
                    state.phase = 'PAUSE';
                    startPauseAnimation();
                }
            } else {
                if (state.phase !== 'ME') {
                    state.phase = 'ME';
                    applyFinalPositions();
                }
                
                // Check if we've completed the full cycle
                if (elapsed >= PHASE_DURATION.YOU + PHASE_DURATION.PAUSE + PHASE_DURATION.ME) {
                    reset();
                }
            }
        }
        
        // ==================== PAUSE PHASE ANIMATION ====================
        
        function startPauseAnimation() {
            state.isAnimating = true;
            
            // Initialize current positions to scattered positions
            for (const key of state.keysPressed) {
                state.currentPos[key] = { ...state.scatteredPos[key] };
            }
            
            animatePause();
        }
        
        function animatePause() {
            if (!state.isAnimating) return;
            
            const elapsed = state.clock;
            const pauseStart = PHASE_DURATION.YOU;
            const pauseElapsed = elapsed - pauseStart;
            const t = Math.min(pauseElapsed / PHASE_DURATION.PAUSE, 1);
            const easedT = easeInOutCubic(t);
            
            // Interpolate positions for all active videos
            for (const key of state.keysPressed) {
                const start = state.scatteredPos[key];
                const end = FINAL_POSITIONS[key];
                
                state.currentPos[key] = {
                    x: lerp(start.x, end.x, easedT),
                    y: lerp(start.y, end.y, easedT),
                    width: lerp(start.width, end.width, easedT),
                    height: lerp(start.height, end.height, easedT)
                };
                
                // Apply interpolated position (no clip-path yet)
                applyPosition(key, state.currentPos[key]);
            }
            
            if (t < 1) {
                requestAnimationFrame(animatePause);
            } else {
                state.isAnimating = false;
            }
        }
        
        // ==================== ME PHASE ====================
        
        function applyFinalPositions() {
            // Apply final positions with clip-path for face composition
            for (const key of state.keysPressed) {
                const pos = FINAL_POSITIONS[key];
                applyPosition(key, pos, pos.clip);
            }
        }
        
        // ==================== RESET ====================
        
        function reset() {
            // Stop all videos
            for (const video of Object.values(state.videoElements)) {
                video.pause();
                video.currentTime = 0;
                video.muted = true;
                video.classList.remove('active');
                video.style.display = 'none';
                video.style.clipPath = 'none';
            }
            
            // Reset state
            state.phase = 'YOU';
            state.clock = 0;
            state.startTime = null;
            state.keysPressed.clear();
            state.keysDown.clear();
            state.scatteredPos = {};
            state.currentPos = {};
            state.isAnimating = false;
            
            if (state.lastFrame) {
                cancelAnimationFrame(state.lastFrame);
                state.lastFrame = null;
            }
            
            updateDebugInfo();
        }
        
        // ==================== CLOCK UPDATE ====================
        
        function updateClock() {
            if (state.startTime) {
                state.clock = Date.now() - state.startTime;
                updatePhase();
                updateDebugInfo();
                state.lastFrame = requestAnimationFrame(updateClock);
            }
        }
        
        // ==================== KEY HANDLERS ====================
        
        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            
            // Ignore if not a mapped key or already down
            if (!VIDEO_MAPPING[key] || state.keysDown.has(key)) return;
            
            state.keysDown.add(key);
            
            const video = state.videoElements[key];
            
            // Start clock on first key press
            if (!state.startTime) {
                state.startTime = Date.now();
                updateClock();
            }
            
            // YOU PHASE: Show video at scattered position
            if (state.phase === 'YOU' && !state.keysPressed.has(key)) {
                state.keysPressed.add(key);
                
                // Generate and store scattered position
                state.scatteredPos[key] = getRandomPosition();
                applyPosition(key, state.scatteredPos[key]);
                
                // Show and play video
                video.style.display = 'block';
                video.classList.add('active');
                video.currentTime = 0;
                video.muted = false; // Unmute for sound
                video.play();
                
                // Check if all keys pressed to trigger PAUSE
                if (state.keysPressed.size === 5) {
                    // Force transition to PAUSE phase
                    state.clock = PHASE_DURATION.YOU;
                    updatePhase();
                }
            }
            // PAUSE or ME PHASE: Unmute if video exists
            else if ((state.phase === 'PAUSE' || state.phase === 'ME') && state.keysPressed.has(key)) {
                video.muted = false;
            }
            
            updateDebugInfo();
        });
        
        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            
            if (!VIDEO_MAPPING[key]) return;
            
            state.keysDown.delete(key);
            
            const video = state.videoElements[key];
            
            // Mute when key released (but don't pause in ME phase)
            if (state.phase === 'YOU') {
                video.muted = true;
            } else if (state.phase === 'PAUSE') {
                video.muted = true;
            }
            // In ME phase, let video continue with sound until end
            
            updateDebugInfo();
        });
        
        // ==================== DEBUG INFO ====================
        
        function updateDebugInfo() {
            document.getElementById('phase').textContent = state.phase;
            document.getElementById('time').textContent = (state.clock / 1000).toFixed(2);
            document.getElementById('keys').textContent = `${state.keysPressed.size}/5`;
            
            // Update individual key status
            for (const key of Object.keys(VIDEO_MAPPING)) {
                const elemId = `key-${key === '.' ? 'period' : key}`;
                const elem = document.getElementById(elemId);
                if (state.keysPressed.has(key)) {
                    elem.textContent = state.keysDown.has(key) ? 'PRESSED' : 'released';
                    elem.className = state.keysDown.has(key) ? 'pressed' : '';
                } else {
                    elem.textContent = '-';
                    elem.className = '';
                }
            }
        }
    </script>
</body>
</html>
